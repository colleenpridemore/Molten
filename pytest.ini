[pytest]
# Pytest configuration for OpenClaw Identity Framework
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    --verbose
    --cov=openclaw_identity
    --cov=empathy_engine
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Markers for different test types
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    empathy: Tests for empathy engine functionality
    security: Security-related tests (GHCP Sentinel)
